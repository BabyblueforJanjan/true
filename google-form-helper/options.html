<!doctype html>
<html lang="th">
<head>

  <title>ตั้งค่า Claude ช่วยติว</title>
  <style>
    body { max-width: 480px; margin: 32px auto; padding: 0 16px; font: 14px/1.6 system-ui, sans-serif; }

  <p>สร้าง API key ได้ที่ <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a><br />
  key จะถูกเก็บไว้ในเบราว์เซอร์ของคุณเท่านั้น และส่งไปที่ api.anthropic.com เท่านั้น</p>
  <script src="options.js"></script>
