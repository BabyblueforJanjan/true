<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    #run {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #673ab7; color: #fff; font-size: 15px; cursor: pointer;
    }
    #run:disabled { opacity: 0.6; cursor: wait; }
    #status { margin-top: 10px; color: #5f6368; min-height: 1.5em; }
    a { color: #673ab7; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🤖 Claude ช่วยติว</h1>
  <button id="run">ให้ Claude ช่วยทำฟอร์มนี้</button>
  <div id="status"></div>
  <a href="#" id="options">ตั้งค่า API key</a>
  <script src="popup.js"></script>
</body>
</html>
