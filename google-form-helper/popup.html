<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    #run {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #673ab7; color: #fff; font-size: 15px; cursor: pointer;
    }
    #run:disabled { opacity: 0.6; cursor: wait; }
    #status { margin-top: 10px; color: #5f6368; min-height: 1.5em; }
    .key { display: flex; gap: 6px; margin-top: 8px; }
    .key input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
    .key button { padding: 6px 10px; border: 1px solid #673ab7; background: #fff; color: #673ab7; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🤖 Claude ช่วยติว</h1>
  <button id="run">ให้ Claude ช่วยทำฟอร์มนี้</button>
  <div id="status"></div>
  <div class="key">
    <input id="key" type="password" placeholder="API key (sk-ant-...)" />
    <button id="save">บันทึก</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
